<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jungle Trail</title>
    <link rel="stylesheet" href="/src/ui/hud.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="hud"></div>
      <div id="start-overlay">
        <div class="start-card">
          <h1>Jungle Trail</h1>
          <p class="subtitle">Off-road expedition — mouse look, manual gearbox</p>
          <div class="garage" role="listbox" aria-label="Choose vehicle">
            <button type="button" class="garage-card selected" data-vehicle="offroad1" role="option" aria-selected="true">
              <span class="garage-name">Trail SUV</span>
              <span class="garage-blurb">Tall wagon for mountain climbs</span>
            </button>
            <button type="button" class="garage-card" data-vehicle="offroad2" role="option" aria-selected="false">
              <span class="garage-name">Ridge Runner</span>
              <span class="garage-blurb">Compact off-roader</span>
            </button>
            <button type="button" class="garage-card" data-vehicle="offroad3" role="option" aria-selected="false">
              <span class="garage-name">Summit Pickup</span>
              <span class="garage-blurb">Long-wheelbase trail truck</span>
            </button>
          </div>
          <button id="start-btn">Start Engine</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
