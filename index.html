<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Himalayan Drive</title>
    <link rel="stylesheet" href="/src/ui/hud.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="hud"></div>
      <div id="start-overlay">
        <div class="start-card">
          <h1>Himalayan Drive</h1>
          <p class="subtitle">Manual-transmission mountain driving simulator</p>
          <button id="start-btn">Start Engine</button>
          <div class="controls-help">
            <div><b>W / S</b> throttle / brake</div>
            <div><b>A / D</b> steer</div>
            <div><b>Clutch slider</b> (left) or <b>Left Shift</b></div>
            <div><b>Q / E</b> shift down / up</div>
            <div><b>1&ndash;5</b> direct gear &nbsp; <b>` or 0</b> reverse &nbsp; <b>N</b> neutral</div>
            <div><b>Space</b> handbrake &nbsp; <b>R</b> ignition / restart</div>
            <div><b>C</b> camera &nbsp; <b>H</b> input bars &nbsp; <b>P</b> pause &nbsp; <b>I</b> help</div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
